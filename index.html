<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚡ 서머너즈 워 공속 계산기</title>
<style>
:root{
  --bg:#0d1117;--card:#161b22;--card2:#1c2128;
  --accent:#58a6ff;--accent2:#bc8cff;--green:#3fb950;
  --yellow:#d29922;--red:#f85149;--text:#e6edf3;--sub:#7d8590;--border:#30363d;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',sans-serif;min-height:100vh;padding:20px;}
h1{text-align:center;font-size:1.5rem;padding:12px 0 20px;background:linear-gradient(90deg,#58a6ff,#bc8cff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.wrap{max-width:1000px;margin:0 auto;}

/* Settings */
.settings{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 18px;margin-bottom:14px;display:flex;align-items:center;gap:20px;flex-wrap:wrap;}
.si{display:flex;align-items:center;gap:8px;font-size:0.85rem;}
.si label{color:var(--sub);}
.si input[type=number]{background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:4px 8px;width:65px;font-size:0.85rem;outline:none;text-align:right;}
.si input:focus{border-color:var(--accent);}
.seg{display:flex;border:1px solid var(--border);border-radius:6px;overflow:hidden;}
.seg button{background:transparent;border:none;color:var(--sub);padding:5px 12px;font-size:0.8rem;cursor:pointer;transition:all .2s;}
.seg button.on{background:var(--accent);color:#fff;}

/* Layout */
.layout{display:grid;grid-template-columns:260px 1fr;gap:14px;}
@media(max-width:700px){.layout{grid-template-columns:1fr;}}

/* Preset list */
.preset-list{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;}
.preset-list h3{font-size:0.72rem;color:var(--sub);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;}
.preset-btn{width:100%;background:var(--card2);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:9px 12px;text-align:left;cursor:pointer;margin-bottom:6px;font-size:0.82rem;transition:all .2s;display:flex;align-items:center;gap:8px;}
.preset-btn:hover{border-color:var(--accent);background:rgba(88,166,255,0.05);}
.preset-btn.active{border-color:var(--accent);background:rgba(88,166,255,0.1);color:var(--accent);}

/* Right panel */
.right-panel{display:flex;flex-direction:column;gap:14px;}

/* Input card */
.input-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;}
.card-title{font-size:0.72rem;color:var(--sub);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px;}
.empty-state{text-align:center;padding:28px;color:var(--sub);font-size:0.85rem;line-height:1.8;}

.m-row{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--card2);border:1px solid var(--border);border-radius:8px;margin-bottom:8px;}
.m-row:last-child{margin-bottom:0;}
.m-row.lead{border-color:rgba(88,166,255,0.35);background:rgba(88,166,255,0.05);}
.m-num{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.72rem;font-weight:700;flex-shrink:0;}
.m-num.n1{background:rgba(88,166,255,0.2);color:var(--accent);}
.m-num.n2{background:rgba(63,185,80,0.2);color:var(--green);}
.m-num.n3{background:rgba(188,140,255,0.2);color:var(--accent2);}
.m-name{font-size:0.88rem;font-weight:600;min-width:72px;}
.m-lbl{font-size:0.76rem;color:var(--sub);flex:1;}
.m-inp{background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:5px 8px;width:80px;font-size:0.88rem;text-align:right;outline:none;transition:border-color .2s;}
.m-inp:focus{border-color:var(--accent);}
.m-unit{font-size:0.74rem;color:var(--sub);min-width:16px;}
.badge{font-size:0.68rem;padding:2px 7px;border-radius:4px;white-space:nowrap;border:1px solid;}
.b-gauge{background:rgba(63,185,80,0.1);color:var(--green);border-color:rgba(63,185,80,0.3);}
.b-speed{background:rgba(88,166,255,0.1);color:var(--accent);border-color:rgba(88,166,255,0.3);}

/* Result */
.result-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;}
table{width:100%;border-collapse:collapse;font-size:0.85rem;}
th{background:var(--card2);padding:8px 12px;color:var(--sub);font-weight:500;border-bottom:1px solid var(--border);text-align:right;}
th:first-child,th:nth-child(2){text-align:left;}
td{padding:10px 12px;border-bottom:1px solid var(--border);text-align:right;}
td:first-child,td:nth-child(2){text-align:left;}
tr:last-child td{border-bottom:none;}
.c-req{font-weight:700;font-size:1.05rem;}
.c1{color:var(--accent);}
.c2{color:var(--green);}
.c3{color:var(--accent2);}
.c-sub{color:var(--sub);}

.buff-flow{margin-top:12px;padding:10px 14px;background:var(--card2);border-radius:8px;font-size:0.8rem;}
.bf-title{color:var(--sub);font-size:0.7rem;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;}
.bf-row{display:flex;align-items:center;gap:8px;margin-bottom:5px;}
.bf-row:last-child{margin-bottom:0;}
.notice{margin-top:10px;font-size:0.74rem;color:var(--sub);padding:8px 12px;background:rgba(210,153,34,0.05);border:1px solid rgba(210,153,34,0.2);border-radius:6px;line-height:1.6;}
</style>
</head>
<body>
<div class="wrap">
<h1>⚡ 공속 순서 계산기</h1>

<!-- Settings -->
<div class="settings">
  <div class="si">
    <label>모드</label>
    <div class="seg">
      <button class="on" id="btn-arena" onclick="setMode('arena',this)">아레나</button>
      <button id="btn-siege" onclick="setMode('siege',this)">점령전</button>
    </div>
  </div>
  <div class="si"><label>리더 공속</label><input type="number" id="leader" value="33" min="0" max="60"> %</div>
  <div class="si"><label>토템 공속</label><input type="number" id="totem"  value="0"  min="0" max="30"> %</div>
</div>

<div class="layout">
<!-- Presets -->
<div class="preset-list">
  <h3>조합 선택</h3>
  <div id="preset-btns"></div>
</div>

<!-- Right -->
<div class="right-panel">
  <div class="input-card">
    <div class="card-title">공속 입력</div>
    <div id="m-inputs"><div class="empty-state">← 조합을 선택하세요</div></div>
  </div>
  <div class="result-card">
    <div class="card-title">계산 결과</div>
    <div id="result"><div class="empty-state">조합과 선턴잡이 뒷속을<br>입력하면 결과가 표시됩니다</div></div>
  </div>
</div>
</div>
</div>

<script>
// ─── PRESET DATA ──────────────────────────────────
// skill: {type:'gauge'|'speed', amount:N, target:idx}
const PRESETS = [
  { id:'hc', name:'빛하피 + 풍초코 + 풍조커', icon:'🧚',
    monsters:[
      {name:'빛하피',  base:120, skill:{type:'gauge',amount:30,  target:1}},
      {name:'풍초코',  base:103, skill:{type:'gauge',amount:45,  target:2}},
      {name:'풍조커',  base:103, skill:null}
    ]},
  { id:'hg', name:'빛하피 + 물가루다 + 풍조커', icon:'🌊',
    monsters:[
      {name:'빛하피',  base:101, skill:{type:'gauge',amount:30,  target:1}},
      {name:'물가루다',base:91,  skill:{type:'gauge',amount:100, target:2}},
      {name:'풍조커',  base:103, skill:null}
    ]},
  { id:'dh', name:'풍드라칸 + 빛하피 + 풍조커', icon:'🐉',
    monsters:[
      {name:'풍드라칸',base:101, skill:{type:'speed',amount:0,   target:1}},
      {name:'빛하피',  base:101, skill:{type:'gauge',amount:30,  target:2}},
      {name:'풍조커',  base:103, skill:null}
    ]},
  { id:'mh', name:'물무희 + 물호박', icon:'🎃',
    monsters:[
      {name:'물호박',  base:101, skill:{type:'gauge',amount:30,  target:1}},
      {name:'물무희',  base:101, skill:{type:'speed',amount:0,   target:2}}
    ]},
  { id:'mp', name:'물해적 + 풍극지', icon:'⚓',
    monsters:[
      {name:'물해적',  base:103, skill:{type:'gauge',amount:30,  target:1}},
      {name:'풍극지',  base:100, skill:null}
    ]},
  { id:'cu', name:'커스텀 (3마리)', icon:'⚙️', custom:true }
];

// ─── STATE ────────────────────────────────────────
let sel = null;
const NC = ['n1','n2','n3'];
const CC = ['c1','c2','c3'];
const CO = ['#58a6ff','#3fb950','#bc8cff'];

// ─── INIT ─────────────────────────────────────────
(function init() {
  const cont = document.getElementById('preset-btns');
  PRESETS.forEach(p => {
    const b = document.createElement('button');
    b.className='preset-btn'; b.id='pb-'+p.id;
    b.innerHTML=`${p.icon} ${p.name}`;
    b.onclick=()=>pick(p);
    cont.appendChild(b);
  });
  document.getElementById('leader').oninput = compute;
  document.getElementById('totem').oninput  = compute;
})();

function setMode(m,btn) {
  document.getElementById('btn-arena').classList.toggle('on',m==='arena');
  document.getElementById('btn-siege').classList.toggle('on',m==='siege');
  document.getElementById('leader').value = m==='siege'?28:33;
  document.getElementById('totem').value  = m==='siege'?15:0;
  compute();
}

// ─── SELECT PRESET ────────────────────────────────
function pick(p) {
  sel = p;
  document.querySelectorAll('.preset-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('pb-'+p.id)?.classList.add('active');
  buildInputs(p);
  compute();
}

function buildInputs(p) {
  const c = document.getElementById('m-inputs');
  c.innerHTML='';
  const mons = p.custom ? customMons() : p.monsters;

  mons.forEach((m,i) => {
    const row = document.createElement('div');
    row.className = 'm-row'+(i===0?' lead':'');

    const badge = m.skill
      ? `<span class="badge ${m.skill.type==='gauge'?'b-gauge':'b-speed'}">
           ${m.skill.type==='gauge'?`게이지 +${m.skill.amount}%`:'속버프'}
         </span>`
      : '';

    if(i===0) {
      row.innerHTML=`
        <div class="m-num ${NC[i]}">${i+1}</div>
        <div class="m-name" style="color:${CO[i]}">${m.name}</div>
        <div class="m-lbl">뒷속 입력 <span style="font-size:.7rem">(기본속 ${m.base})</span></div>
        <input class="m-inp" type="number" id="r0" value="220" min="0" oninput="compute()">
        ${badge}
      `;
    } else {
      row.innerHTML=`
        <div class="m-num ${NC[i]}">${i+1}</div>
        <div class="m-name" style="color:${CO[i]}">${m.name}</div>
        <div class="m-lbl">공속아티 % <span style="font-size:.7rem">(기본속 ${m.base})</span></div>
        <input class="m-inp" type="number" id="a${i}" value="0" min="0" max="100" oninput="compute()">
        <span class="m-unit">%</span>
        ${badge}
      `;
    }
    c.appendChild(row);
  });
}

function customMons() {
  return [
    {name:'몬1',base:101,skill:{type:'gauge',amount:30,target:1}},
    {name:'몬2',base:101,skill:{type:'gauge',amount:30,target:2}},
    {name:'몬3',base:103,skill:null}
  ];
}

// ─── CORE CALCULATION ─────────────────────────────
function compute() {
  if(!sel) return;
  const ldr   = parseFloat(document.getElementById('leader').value)||0;
  const tot   = parseFloat(document.getElementById('totem').value)||0;
  const rate  = (ldr+tot)/100;
  const TR    = 0.07;
  const r0el  = document.getElementById('r0');
  if(!r0el) return;
  const rune0 = parseFloat(r0el.value)||0;

  const mons = sel.custom ? customMons() : sel.monsters;

  // Monster 1
  const b1   = Math.ceil(mons[0].base*(1+rate));
  const spd1 = b1+rune0;
  const T1   = Math.floor(100/(spd1*TR))+1;

  const results = [{name:mons[0].name,base:mons[0].base,rune:rune0,final:spd1,T:T1}];

  // Monsters 2+
  for(let i=1;i<mons.length;i++){
    const m   = mons[i];
    const Ti  = T1+i;
    const bi  = Math.ceil(m.base*(1+rate));
    const prev= mons[i-1];
    const arti= parseFloat(document.getElementById(`a${i}`)?.value)||0;

    let minSpd;
    if(prev.skill?.type==='speed'){
      // Speed buff: (spd1*Ti) / (Tj + buffMul*(Ti-Tj))
      const Tj     = T1+(i-1);
      const bMul   = 1+0.3*(1+arti/100);
      minSpd = Math.ceil(spd1*Ti/(Tj+bMul*(Ti-Tj)))+1;
    } else {
      // Gauge buff
      const G = prev.skill?.amount||0;
      minSpd = Math.ceil(spd1 - G/(TR*Ti))+1;
    }

    const rune_i = Math.max(0, minSpd-bi);
    results.push({name:m.name,base:m.base,rune:rune_i,final:bi+rune_i,T:Ti});
  }

  renderResults(results, mons);
}

// ─── RENDER ───────────────────────────────────────
function renderResults(res, mons) {
  let html = `<table><thead><tr>
    <th>순서</th><th>몬스터</th><th>기본속</th>
    <th>필요 뒷속</th><th>최종 합속</th>
  </tr></thead><tbody>`;

  res.forEach((r,i)=>{
    html+=`<tr>
      <td style="color:var(--sub)">${r.order||i+1}</td>
      <td style="font-weight:600;color:${CO[i]}">${r.name}</td>
      <td class="c-sub">${r.base}</td>
      <td class="c-req ${CC[i]}">${r.rune}</td>
      <td>${r.final}</td>
    </tr>`;
  });
  html+=`</tbody></table>`;

  // Buff flow
  const buffs = mons.filter(m=>m.skill).map(m=>{
    const tgt = mons[m.skill.target];
    const typeStr = m.skill.type==='gauge'
      ? `게이지 +${m.skill.amount}%`
      : '속도 버프';
    return `<div class="bf-row">
      <span style="font-weight:600;color:var(--accent)">${m.name}</span>
      <span style="color:var(--sub)">→</span>
      <span style="font-weight:600;color:var(--green)">${tgt?.name||'?'}</span>
      <span class="badge ${m.skill.type==='gauge'?'b-gauge':'b-speed'}">${typeStr}</span>
    </div>`;
  }).join('');

  if(buffs) html+=`<div class="buff-flow"><div class="bf-title">스킬 연계</div>${buffs}</div>`;

  html+=`<p class="notice">※ 실제 사용 전 연계 테스트 후 사용하세요. 필요 뒷속은 1~2 차이날 수 있습니다.</p>`;

  document.getElementById('result').innerHTML = html;
}
</script>
</body>
</html>
